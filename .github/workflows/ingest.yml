name: Ingest carousels

on:
  push:
    paths:
      - "carousels/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-audit --no-fund

      - name: Convert slides and update manifest
        run: node scripts/ingest.js

      - name: Commit results
        run: |
          git config user.name "rtb-autopost"
          git config user.email "actions@github.com"
          git add published manifest.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "ingest: process new carousels"
            git push
          fi
