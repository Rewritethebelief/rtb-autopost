name: Refresh Instagram token

on:
  schedule:
    # 1st of every month. Tokens last 60 days, so this refreshes with
    # roughly a month of headroom.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-audit --no-fund

      - name: Rotate the token
        id: rotate
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: node scripts/refresh-token.js

      - name: Open an issue if the refresh failed
        if: steps.rotate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REASON=$(cat REFRESH_FAILED 2>/dev/null || echo "unknown error")
          gh issue create \
            --title "URGENT — Instagram token refresh failed" \
            --body "**Fix this within 60 days or posting stops entirely.**

          **Error:** $REASON

          Check in this order:
          1. Has SECRETS_PAT expired? Regenerate at Settings > Developer settings >
             Personal access tokens, with Secrets: read and write on this repo.
          2. Has the Instagram token already expired? Generate a fresh one in the
             Meta app dashboard and paste it into the IG_ACCESS_TOKEN secret manually.
          3. Re-run this workflow from the Actions tab once fixed."

      - name: Fail the run if the refresh failed
        if: steps.rotate.outcome == 'failure'
        run: exit 1
